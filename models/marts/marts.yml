version: 2

models:
  - name: fct_spend
    description: "One row per PO with denormalized vendor + contract attributes. Foundational spend fact table."
    columns:
      - name: po_id
        description: "Unique PO identifier - grain of this table"
        tests:
          - unique
          - not_null
      - name: po_amount
        description: "Purchase order amount in USD"
        tests:
          - not_null
      - name: vendor_id
        description: "Vendor placing the PO"
        tests:
          - not_null

  - name: fct_vendor_concentration
    description: "Vendor-level rollup with spend, share of total, tier (Top 20 / Top 100 / Tail)"
    columns:
      - name: vendor_id
        description: "Unique vendor identifier"
        tests:
          - unique
          - not_null
      - name: spend_tier
        description: "Concentration tier: Top 20, Top 100, or Tail"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Top 20', 'Top 100', 'Tail']

  - name: fct_contract_compliance
    description: "Department + category level compliance metrics. Maverick vs on-contract."
    columns:
      - name: requester_dept
        description: "Department requesting the PO"
        tests:
          - not_null
      - name: category
        description: "Spend category"
        tests:
          - not_null

  - name: dim_vendors
    description: "Vendor dimension. One row per vendor with attributes + pre-computed lifetime activity metrics and contract summary."
    columns:
      - name: vendor_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: vendor_activity_status
        description: "Active / Dormant / Inactive based on recency of POs"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Active', 'Dormant', 'Inactive']
      - name: risk_tier
        description: "Low / Medium / High risk tier"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Low', 'Medium', 'High']

  - name: fct_savings
    description: "Contract-level savings mart. Compares estimated vs realized savings and buckets contracts by realization performance."
    columns:
      - name: contract_id
        description: "Primary key - one row per contract"
        tests:
          - unique
          - not_null
      - name: realization_tier
        description: "Bucket: Unused Contract / Significant Shortfall / Underperforming / On Track"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Unused Contract', 'Significant Shortfall', 'Underperforming', 'On Track']

  - name: fct_process_kpis
    description: "Monthly × category rollup of process metrics: cycle time, DPO, 3-way match rate, on-time delivery/payment rates."
    columns:
      - name: month
        description: "Month bucket (first day of month)"
        tests:
          - not_null
      - name: category
        description: "Spend category"
        tests:
          - not_null

  - name: fct_spend_trend
    description: "Monthly spend trend by category and spend type with YoY comparison. Powers time-series charts."
    columns:
      - name: month
        description: "Month bucket (first day of month)"
        tests:
          - not_null
      - name: category
        description: "Spend category"
        tests:
          - not_null
      - name: spend_type
        description: "Direct or Indirect"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Direct', 'Indirect']